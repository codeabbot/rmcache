plugins {
    alias(libs.plugins.jmh)
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
}

group = "com.codeabbot"
version = "0.0.1"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.slf4j.api

    testImplementation libs.bundles.testing
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    jmh libs.jmh.core
    jmh libs.jmh.annproc
    jmh libs.caffeine
    jmh libs.mapdb
    jmh libs.chronicle.map
    jmh "org.ehcache:ehcache:3.10.8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    testLogging {
        events("passed", "skipped", "failed", "standardOut", "standardError")
        showStandardStreams = true
    }
}

// ─── JaCoCo ──────────────────────────────────────────────────────────────────

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/benchmark/**',
                '**/package-info.class',
                '**/module-info.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/benchmark/**',
                '**/package-info.class',
                '**/module-info.class'
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

test.finalizedBy(jacocoTestReport)

// ─── JMH ─────────────────────────────────────────────────────────────────────

jmh {
    includes = [project.findProperty("jmh.includes")?.toString() ?: "ComparativeWorkloadBenchmark"]
    iterations = project.findProperty("jmh.iterations")?.toString()?.toInteger() ?: 2
    warmupIterations = project.findProperty("jmh.warmupIterations")?.toString()?.toInteger() ?: 1
    fork = 1
    threads = project.findProperty("jmh.threads")?.toString()?.toInteger() ?: 4
    jvmArgs = [
        "--enable-native-access=ALL-UNNAMED",
        "-Xmx8g",
        "-XX:+UseG1GC",
        // Required by MapDB and ChronicleMap on JDK 25
        "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.util=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED"
    ]
    resultFormat = "text"
}

// ─── Publishing ──────────────────────────────────────────────────────────────

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = "RMCache"
                description = "High-performance billion-scale off-heap cache for JVM — requires JDK 25+ (LTS)"
                url = "https://github.com/codeabbot/rmcache"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "codeabbot"
                        name = "CodeAbbot Team"
                        email = "maintainers@codeabbot.com"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/codeabbot/rmcache.git"
                    developerConnection = "scm:git:ssh://github.com/codeabbot/rmcache.git"
                    url = "https://github.com/codeabbot/rmcache"
                }
            }
        }
    }
    repositories {
        maven {
            name = "OSSRH"
            // Defaults point at the Sonatype Central Portal's OSSRH-compatibility
            // endpoints, which accept the same Maven deploys as the legacy OSSRH
            // URLs. Override via -PsonatypeReleaseUrl / -PsonatypeSnapshotUrl
            // (or the corresponding env vars) if you're still on s01.oss.sonatype.org.
            def defaultRelease = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def defaultSnapshot = "https://central.sonatype.com/repository/maven-snapshots/"
            def releaseUrl = findProperty("sonatypeReleaseUrl") ?: System.getenv("SONATYPE_RELEASE_URL") ?: defaultRelease
            def snapshotUrl = findProperty("sonatypeSnapshotUrl") ?: System.getenv("SONATYPE_SNAPSHOT_URL") ?: defaultSnapshot
            url = uri(version.toString().endsWith("-SNAPSHOT") ? snapshotUrl : releaseUrl)
            credentials {
                username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME") ?: ""
                password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD") ?: ""
            }
        }
    }
}
signing {
    // Sign whenever any publish-related task is in the graph (publish,
    // publishMavenPublicationToOSSRHRepository, etc.) but not for plain local
    // builds. Supports both the classic keyring-file properties
    // (signing.keyId / signing.secretKeyRingFile / signing.password) and an
    // in-memory ASCII-armored key (CI-friendly). In-memory mode wins when set.
    required { gradle.taskGraph.allTasks.any { it.name.contains("publish") } }

    def signingKey = findProperty("signingKey") ?: System.getenv("SIGNING_KEY")
    def signingPassword = findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD")
    def rawKeyId = findProperty("signingKeyId") ?: System.getenv("SIGNING_KEY_ID") ?: findProperty("signing.keyId")

    // Gradle's PgpKeyId only parses short (8-char) keyIds, but modern GPG
    // tooling emits long (16-char) keyIds. Normalize to the last 8 chars so
    // users can paste the output of `gpg --list-secret-keys --keyid-format=long`
    // directly without Gradle choking on PgpKeyId.normaliseKeyId.
    def signingKeyId = rawKeyId?.toString()?.replaceFirst(/^0x/, '')
    if (signingKeyId && signingKeyId.length() > 8) {
        signingKeyId = signingKeyId.substring(signingKeyId.length() - 8)
    }

    if (signingKey) {
        // Fail loudly if the property is set but obviously not an ASCII-armored
        // key. Real armored keys are thousands of chars; a 40-char value is
        // almost always a fingerprint or keyId pasted into the wrong property.
        // Gradle's downstream error for this is "no configured signatory",
        // which is opaque.
        if (signingKey.toString().length() < 256 || !signingKey.toString().contains("BEGIN PGP PRIVATE KEY")) {
            throw new GradleException(
                "signingKey does not look like an ASCII-armored PGP private key " +
                "(got ${signingKey.toString().length()} chars, expected thousands). " +
                "Paste the full output of " +
                "`gpg --export-secret-keys --armor <keyId>` including the " +
                "BEGIN/END PGP PRIVATE KEY BLOCK lines.")
        }
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }

    sign publishing.publications
}

// ─── Custom tasks ────────────────────────────────────────────────────────────

tasks.register('runMemoryScalability', JavaExec) {
    group = "benchmark"
    description = "Runs the Memory Scalability Suite (10k / 100k / 1M + 1B Projection)"
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = "com.codeabbot.rmcache.benchmark.MemoryScalabilitySuite"
    jvmArgs(
        "--enable-native-access=ALL-UNNAMED",
        "-Xmx8g",
        "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.util=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED"
    )
}
