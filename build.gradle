plugins {
    alias(libs.plugins.jmh)
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
}

group = "com.codeabbot"
version = "0.0.2"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.slf4j.api

    testImplementation platform(libs.junit.bom)
    testImplementation libs.bundles.testing
    testRuntimeOnly libs.junit.platform.launcher

    jmh libs.jmh.core
    jmh libs.jmh.annproc
    jmh libs.caffeine
    jmh libs.mapdb
    jmh libs.chronicle.map
    jmh libs.ehcache
    jmh libs.ohc.core
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    testLogging {
        events("passed", "skipped", "failed", "standardOut", "standardError")
        showStandardStreams = true
    }
}

// ─── JaCoCo ──────────────────────────────────────────────────────────────────

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/benchmark/**',
                '**/package-info.class',
                '**/module-info.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/benchmark/**',
                '**/package-info.class',
                '**/module-info.class'
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

test.finalizedBy(jacocoTestReport)

// ─── JMH ─────────────────────────────────────────────────────────────────────

jmh {
    includes = [project.findProperty("jmh.includes")?.toString() ?: "ComparativeWorkloadBenchmark"]
    iterations = project.findProperty("jmh.iterations")?.toString()?.toInteger() ?: 2
    warmupIterations = project.findProperty("jmh.warmupIterations")?.toString()?.toInteger() ?: 1
    fork = 1
    threads = project.findProperty("jmh.threads")?.toString()?.toInteger() ?: 4
    jvmArgs = [
        "--enable-native-access=ALL-UNNAMED",
        "-Xmx8g",
        "-XX:+UseG1GC",
        // Required by MapDB and ChronicleMap on JDK 25
        "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.util=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED"
    ]
    resultFormat = "text"
}

// ─── Publishing ──────────────────────────────────────────────────────────────

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = "RMCache"
                description = "High-performance billion-scale off-heap cache for JVM — requires JDK 25+ (LTS)"
                url = "https://github.com/codeabbot/rmcache"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "rabindrameher"
                        name = "Rabindra Meher"
                        email = "maintainers@codeabbot.com"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/codeabbot/rmcache.git"
                    developerConnection = "scm:git:ssh://github.com/codeabbot/rmcache.git"
                    url = "https://github.com/codeabbot/rmcache"
                }
            }
        }
    }
    repositories {
        // Legacy flow — `./gradlew publish` uploads here. Artifacts land in a
        // staging area that is NOT auto-promoted to the Deployments dashboard;
        // the caller must also POST to /manual/upload/defaultRepository/<ns>
        // (or click "Close" in the Nexus UI) before the deployment becomes
        // visible. Prefer `./gradlew publishToMavenCentral` (defined below)
        // for hands-free release via the Publisher API.
        maven {
            name = "OSSRH"
            def defaultRelease = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def defaultSnapshot = "https://central.sonatype.com/repository/maven-snapshots/"
            def releaseUrl = findProperty("sonatypeReleaseUrl") ?: System.getenv("SONATYPE_RELEASE_URL") ?: defaultRelease
            def snapshotUrl = findProperty("sonatypeSnapshotUrl") ?: System.getenv("SONATYPE_SNAPSHOT_URL") ?: defaultSnapshot
            url = uri(version.toString().endsWith("-SNAPSHOT") ? snapshotUrl : releaseUrl)
            credentials {
                username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME") ?: ""
                password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD") ?: ""
            }
        }
        // File-based staging for the Central Portal Publisher API. The task
        // publishMavenPublicationToCentralPortalStagingRepository writes the
        // Maven tree (with .asc/.md5/.sha1) here; bundleForCentralPortal zips
        // it; publishToMavenCentral uploads with publishingType=AUTOMATIC.
        maven {
            name = "CentralPortalStaging"
            url = layout.buildDirectory.dir("central-portal-staging").get().asFile.toURI()
        }
    }
}
signing {
    // Sign whenever any publish-related task is in the graph (publish,
    // publishMavenPublicationToOSSRHRepository, etc.) but not for plain local
    // builds. Supports both the classic keyring-file properties
    // (signing.keyId / signing.secretKeyRingFile / signing.password) and an
    // in-memory ASCII-armored key (CI-friendly). In-memory mode wins when set.
    required { gradle.taskGraph.allTasks.any { it.name.contains("publish") } }

    def signingKey = findProperty("signingKey") ?: System.getenv("SIGNING_KEY")
    def signingPassword = findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD")
    def rawKeyId = findProperty("signingKeyId") ?: System.getenv("SIGNING_KEY_ID") ?: findProperty("signing.keyId")

    // Gradle's PgpKeyId only parses short (8-char) keyIds, but modern GPG
    // tooling emits long (16-char) keyIds. Normalize to the last 8 chars so
    // users can paste the output of `gpg --list-secret-keys --keyid-format=long`
    // directly without Gradle choking on PgpKeyId.normaliseKeyId.
    def signingKeyId = rawKeyId?.toString()?.replaceFirst(/^0x/, '')
    if (signingKeyId && signingKeyId.length() > 8) {
        signingKeyId = signingKeyId.substring(signingKeyId.length() - 8)
    }

    if (signingKey) {
        // Fail loudly if the property is set but obviously not an ASCII-armored
        // key. Real armored keys are thousands of chars; a 40-char value is
        // almost always a fingerprint or keyId pasted into the wrong property.
        // Gradle's downstream error for this is "no configured signatory",
        // which is opaque.
        if (signingKey.toString().length() < 256 || !signingKey.toString().contains("BEGIN PGP PRIVATE KEY")) {
            throw new GradleException(
                "signingKey does not look like an ASCII-armored PGP private key " +
                "(got ${signingKey.toString().length()} chars, expected thousands). " +
                "Paste the full output of " +
                "`gpg --export-secret-keys --armor <keyId>` including the " +
                "BEGIN/END PGP PRIVATE KEY BLOCK lines.")
        }
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }

    sign publishing.publications
}

// ─── Maven Central Portal auto-publish (Publisher API) ──────────────────────
// The legacy OSSRH-compat endpoint (ossrh-staging-api.central.sonatype.com)
// requires an extra "close" step before a deployment becomes visible at
// https://central.sonatype.com/publishing/deployments, and then a second
// manual click to actually release. The Central Portal Publisher API
// eliminates both steps: one POST with ?publishingType=AUTOMATIC uploads
// the bundle, validates it, and auto-transitions PUBLISHING → PUBLISHED.
//
// Usage: ./gradlew publishToMavenCentral
//
// Credentials — user token from https://central.sonatype.com/account
// (these are the same credentials accepted by the OSSRH-compat endpoint;
// any of the following is honored):
//   centralPortalUsername  or  CENTRAL_PORTAL_USERNAME  or  ossrhUsername
//   centralPortalPassword  or  CENTRAL_PORTAL_PASSWORD  or  ossrhPassword
//
// Reference: https://central.sonatype.org/publish/publish-portal-api/

tasks.register('bundleForCentralPortal', Zip) {
    group = "publishing"
    description = "Bundle signed artifacts + .asc/.md5/.sha1 into a ZIP for the Central Portal Publisher API."
    // Gather the root jar AND every published module into the one bundle (Central Portal accepts
    // a single archive containing multiple components). All modules publish into this same
    // central-portal-staging dir via gradle/maven-publish-conventions.gradle.
    dependsOn 'publishMavenPublicationToCentralPortalStagingRepository',
              ':rmcache-metrics:publishMavenPublicationToCentralPortalStagingRepository',
              ':rmcache-micrometer:publishMavenPublicationToCentralPortalStagingRepository',
              ':rmcache-opentelemetry:publishMavenPublicationToCentralPortalStagingRepository',
              ':rmcache-jcache:publishMavenPublicationToCentralPortalStagingRepository'
    archiveFileName = "${project.name}-${project.version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir("central-portal")
    from layout.buildDirectory.dir("central-portal-staging")
    // Portal rejects repository-level maven-metadata.xml inside deployment bundles.
    exclude '**/maven-metadata.xml*'
}

tasks.register('publishToMavenCentral') {
    group = "publishing"
    description = "Upload bundle to Sonatype Central Portal with publishingType=AUTOMATIC; polls until PUBLISHED."
    dependsOn 'bundleForCentralPortal'

    doLast {
        def tokenUser = findProperty("centralPortalUsername") ?:
                        System.getenv("CENTRAL_PORTAL_USERNAME") ?:
                        findProperty("ossrhUsername") ?:
                        System.getenv("OSSRH_USERNAME")
        def tokenPass = findProperty("centralPortalPassword") ?:
                        System.getenv("CENTRAL_PORTAL_PASSWORD") ?:
                        findProperty("ossrhPassword") ?:
                        System.getenv("OSSRH_PASSWORD")
        if (!tokenUser || !tokenPass) {
            throw new GradleException(
                "Central Portal credentials not set. Generate a user token at " +
                "https://central.sonatype.com/account and set centralPortalUsername " +
                "/ centralPortalPassword (or ossrhUsername / ossrhPassword).")
        }

        def bundleFile = tasks.bundleForCentralPortal.archiveFile.get().asFile
        def deployName = "${project.group}:${project.name}:${project.version}"
        def encName = URLEncoder.encode(deployName, 'UTF-8')
        def auth = "Bearer " + Base64.encoder.encodeToString("${tokenUser}:${tokenPass}".bytes)

        def uploadUrl = new URL("https://central.sonatype.com/api/v1/publisher/upload" +
                "?name=${encName}&publishingType=AUTOMATIC")
        def boundary = "----" + UUID.randomUUID().toString().replace("-", "")

        println "Uploading ${bundleFile.name} (${bundleFile.length()} bytes) to Central Portal..."
        HttpURLConnection conn = (HttpURLConnection) uploadUrl.openConnection()
        conn.doOutput = true
        conn.requestMethod = 'POST'
        conn.setRequestProperty('Authorization', auth)
        conn.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")
        conn.setChunkedStreamingMode(1024 * 1024)

        conn.outputStream.withStream { os ->
            os.write("--${boundary}\r\n".bytes)
            os.write(("Content-Disposition: form-data; name=\"bundle\"; " +
                      "filename=\"${bundleFile.name}\"\r\n").bytes)
            os.write("Content-Type: application/octet-stream\r\n\r\n".bytes)
            bundleFile.withInputStream { is -> os << is }
            os.write("\r\n--${boundary}--\r\n".bytes)
        }

        int code = conn.responseCode
        def body = (code < 400 ? conn.inputStream : conn.errorStream).text
        if (code != 201 && code != 200) {
            throw new GradleException("Central Portal upload failed: HTTP ${code}\n${body}")
        }
        def deployId = body.trim()
        println "Upload accepted. Deployment ID: ${deployId}"
        println "Tracking at https://central.sonatype.com/publishing/deployments"
        println ""

        // Poll deployment state until PUBLISHED (success) or FAILED (abort).
        // With AUTOMATIC: PENDING → VALIDATING → PUBLISHING → PUBLISHED.
        def statusUrl = new URL("https://central.sonatype.com/api/v1/publisher/status?id=${deployId}")
        def deadline = System.currentTimeMillis() + 15 * 60 * 1000L
        def lastState = null
        while (System.currentTimeMillis() < deadline) {
            HttpURLConnection sc = (HttpURLConnection) statusUrl.openConnection()
            sc.requestMethod = 'POST'
            sc.setRequestProperty('Authorization', auth)
            int scode = sc.responseCode
            def sbody = (scode < 400 ? sc.inputStream : sc.errorStream).text
            if (scode >= 400) {
                throw new GradleException("Status check failed: HTTP ${scode}\n${sbody}")
            }
            def m = (sbody =~ /"deploymentState"\s*:\s*"([A-Z_]+)"/)
            if (m.find()) {
                def cur = m.group(1)
                if (cur != lastState) {
                    println "  [${new Date().format('HH:mm:ss')}] ${cur}"
                    lastState = cur
                }
                if (cur == 'PUBLISHED') {
                    def groupPath = project.group.toString().replace('.', '/')
                    println ""
                    println "Released to Maven Central."
                    println "  Repository: https://repo1.maven.org/maven2/${groupPath}/${project.name}/${project.version}/"
                    println "  Search (may lag 2-4h): https://central.sonatype.com/artifact/${project.group}/${project.name}/${project.version}"
                    return
                }
                if (cur == 'FAILED') {
                    throw new GradleException("Deployment FAILED:\n${sbody}")
                }
            }
            Thread.sleep(5000)
        }
        throw new GradleException("Timed out waiting for deployment ${deployId}; check the Portal dashboard.")
    }
}

// ─── Custom tasks ────────────────────────────────────────────────────────────

tasks.register('runMemoryScalability', JavaExec) {
    group = "benchmark"
    description = "Runs the Memory Scalability Suite (10k / 100k / 1M + 1B Projection)"
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = "com.codeabbot.rmcache.benchmark.MemoryScalabilitySuite"
    jvmArgs(
        "--enable-native-access=ALL-UNNAMED",
        "-Xmx8g",
        "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.util=ALL-UNNAMED",
        "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED"
    )
}
