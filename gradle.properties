org.gradle.configuration-cache=false

# ─── Maven Central publishing ────────────────────────────────────────────────
# Set these in ~/.gradle/gradle.properties (NOT in this repo) or via env vars.
# The Gradle `ORG_GRADLE_PROJECT_<name>` env-var convention works for any
# property below; plain env-var names are also accepted where noted.
#
# Sonatype credentials (user token from central.sonatype.com → View Account):
#   ossrhUsername=<user-token username>   or  OSSRH_USERNAME
#   ossrhPassword=<user-token password>   or  OSSRH_PASSWORD
#
# GPG signing — choose ONE of the two modes:
#   (A) Keyring file:
#     signing.keyId=<short 8-char key id>
#     signing.password=<gpg passphrase>
#     signing.secretKeyRingFile=/path/to/secring.gpg
#   (B) In-memory (CI-friendly, ASCII-armored secret key):
#     signingKey=<multi-line armored key>        or  SIGNING_KEY
#     signingPassword=<gpg passphrase>           or  SIGNING_PASSWORD
#     signingKeyId=<optional key id>             or  SIGNING_KEY_ID
# If both are present, mode (B) wins. build.gradle normalizes long-form
# (16-char) keyIds down to the short 8-char form Gradle requires, so you
# can keep `signing.keyId=<long-form>` as produced by
# `gpg --list-secret-keys --keyid-format=long` and it'll just work.
#
# Optional endpoint overrides (default = Central Portal OSSRH-compat URLs):
#   sonatypeReleaseUrl=...                       or  SONATYPE_RELEASE_URL
#   sonatypeSnapshotUrl=...                      or  SONATYPE_SNAPSHOT_URL
# Legacy OSSRH users override to:
#   sonatypeReleaseUrl=https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/
#   sonatypeSnapshotUrl=https://s01.oss.sonatype.org/content/repositories/snapshots/

