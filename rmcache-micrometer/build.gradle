plugins {
    id 'java-library'
}

group = "com.codeabbot"
version = "0.0.2"
description = "RMCache Micrometer binder: exposes cache statistics as Micrometer meters"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

apply from: "$rootDir/gradle/maven-publish-conventions.gradle"

repositories {
    mavenCentral()
}

dependencies {
    api project(':')
    api libs.micrometer.core

    testImplementation platform(libs.junit.bom)
    testImplementation libs.bundles.testing
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs("--enable-native-access=ALL-UNNAMED")
}
