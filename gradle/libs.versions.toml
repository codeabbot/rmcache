[versions]
slf4j = "2.0.18"
logback = "1.6.3"
micrometer-core = "1.17.1"
opentelemetry = "1.65.0"
cacheApi = "1.1.1"

# test dependencies — JUnit versions (Jupiter 5.x + Platform 1.x) are aligned
# via the JUnit BOM (junit-bom) so they can never drift apart.
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.23.0"

# benchmark (jmh) dependencies
jmh = "1.37"
caffeine = "3.2.4"
mapdb = "3.1.0"
chronicleMap = "2026.1"
ohc = "0.7.4"
ehcache = "3.12.0"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer-core" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
javax-cache = { module = "javax.cache:cache-api", version.ref = "cacheApi" }

# JUnit — version managed by junit-bom (declared as a platform in build.gradle).
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annproc = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
mapdb = { module = "org.mapdb:mapdb", version.ref = "mapdb" }
chronicle-map = { module = "net.openhft:chronicle-map", version.ref = "chronicleMap" }
ohc-core = { module = "org.caffinitas.ohc:ohc-core", version.ref = "ohc" }
ehcache = { module = "org.ehcache:ehcache", version.ref = "ehcache" }

[bundles]
testing = ["jupiter-api", "jupiter-engine", "jupiter-params", "assertj-core", "mockito-core", "mockito-junit-jupiter", "logback-classic"]

[plugins]
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
